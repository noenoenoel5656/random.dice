<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デジタルサイコロ</title>
<style>
  :root {
    --main-color: #7457d9;
    --background-color: #f6f3ff;
    --button-color: #7457d9;
    --dice-color: #ffffff;
    --pip-color: #292333;
    --one-pip-color: #e34b52;
    --ink-color: #292333;
    --muted-color: #716b7d;
    --main-soft: color-mix(in srgb, var(--main-color) 16%, white);
    --main-pale: color-mix(in srgb, var(--main-color) 8%, white);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--background-color);
    color: var(--ink-color);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: min(760px, 100%);
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(50, 35, 80, .12);
  }
  h1 {
    margin: 0 0 8px;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic Rounded", "Arial Rounded MT Bold", "Nunito", sans-serif;
    font-size: 30px;
    letter-spacing: .04em;
  }
  .desc { margin: 0 0 24px; color: var(--muted-color); }
  .dice {
    width: 180px;
    height: 180px;
    margin: 12px auto 24px;
    border: 5px solid var(--ink-color);
    border-radius: 28px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    padding: 24px;
    background: var(--dice-color);
    position: relative;
    transition: transform .12s ease;
  }
  .pip {
    width: 24px;
    height: 24px;
    place-self: center;
    border-radius: 50%;
    background: var(--pip-color);
    opacity: 0;
    transform: scale(.6);
    transition: opacity .12s ease, transform .12s ease;
    z-index: 1;
  }
  .pip.is-visible { opacity: 1; transform: scale(1); }
  .dice[data-value="1"] .pip.is-visible { background: var(--one-pip-color); }
  .rolling { animation: shake .18s infinite alternate; }
  @keyframes shake {
    from { transform: rotate(-4deg) scale(.98); }
    to { transform: rotate(4deg) scale(1.02); }
  }
  .ping-effect {
    position: absolute;
    inset: -60px;
    pointer-events: none;
    z-index: 0;
  }
  .ray {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 13px;
    height: 54px;
    border-radius: 3px;
    background: #ffd34e;
    clip-path: polygon(18% 0, 100% 8%, 78% 100%, 0 88%);
    opacity: 0;
    transform: translate(-50%, -50%) rotate(var(--ray-angle)) translateY(-146px) scaleY(.55);
  }
  .ray:nth-child(1) { --ray-angle: -18deg; height: 58px; }
  .ray:nth-child(2) { --ray-angle: 62deg; height: 51px; }
  .ray:nth-child(3) { --ray-angle: 145deg; height: 60px; }
  .ray:nth-child(4) { --ray-angle: 254deg; height: 48px; }
  .ping-effect.is-active .ray { animation: ping-ray .42s ease-out both; }
  @keyframes ping-ray {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--ray-angle)) translateY(-132px) scaleY(.4);
    }
    22% { opacity: .9; }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--ray-angle)) translateY(-160px) scaleY(1);
    }
  }
  .faces {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin: 12px 0 20px;
  }
  .face {
    border: 2px solid #ddd7e8;
    background: #faf9fc;
    border-radius: 14px;
    padding: 14px 6px;
    cursor: pointer;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    user-select: none;
  }
  .face.selected {
    border-color: var(--main-color);
    background: var(--main-soft);
    color: var(--main-color);
  }
  .face input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }
  .face:focus-within { outline: 3px solid var(--main-color); outline-offset: 2px; }
  button {
    border: 0;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .roll {
    width: 100%;
    background: var(--button-color);
    color: white;
    font-size: 20px;
    padding: 17px;
  }
  .roll:disabled { opacity: .55; cursor: not-allowed; }
  .secondary {
    background: var(--main-pale);
    color: var(--ink-color);
  }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .row button { flex: 1; }
  .status {
    text-align: center;
    color: var(--muted-color);
    margin: 14px 0 0;
    min-height: 24px;
  }
  .history {
    margin-top: 26px;
    border-top: 1px solid var(--main-pale);
    padding-top: 20px;
  }
  .history h2 { font-size: 18px; margin: 0 0 10px; }
  #history {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .history-item {
    background: var(--main-pale);
    border-radius: 10px;
    padding: 7px 11px;
    font-weight: 700;
  }
  .prob {
    text-align: center;
    font-size: 14px;
    color: var(--muted-color);
    margin-top: 4px;
  }
  .customizer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--main-pale);
  }
  .customizer h2 { font-size: 18px; margin: 0 0 6px; }
  .customizer p { margin: 0 0 14px; color: var(--muted-color); font-size: 14px; }
  .color-controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .color-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 54px;
    padding: 10px 12px;
    border: 2px solid var(--main-pale);
    border-radius: 14px;
    background: #fff;
    font-weight: 700;
  }
  .color-control input {
    width: 36px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:focus-visible, .color-control input:focus-visible {
    outline: 3px solid var(--main-color);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    .rolling, .ping-effect.is-active .ray { animation: none; }
    .dice, .pip { transition: none; }
  }
  @media (max-width: 520px) {
    .faces { grid-template-columns: repeat(3, 1fr); }
    .app { padding: 20px; }
    .color-controls { grid-template-columns: 1fr; }
    .dice { width: 160px; height: 160px; padding: 21px; }
    .pip { width: 21px; height: 21px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎲 デジタルサイコロ</h1>
  <p class="desc">出る面だけ選択。選択された面はすべて同じ確率で出ます。</p>

  <div id="dice" class="dice" role="img" aria-label="まだ振られていないサイコロ">
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <span class="pip"></span><span class="pip"></span><span class="pip"></span>
    <div class="ping-effect" id="ping-effect" aria-hidden="true">
      <span class="ray"></span><span class="ray"></span><span class="ray"></span><span class="ray"></span>
    </div>
  </div>

  <div class="prob" id="prob">6面すべて選択中 → 各 16.67%</div>

  <h2>出現させる面</h2>
  <div class="faces" id="faces"></div>

  <button class="roll" id="roll">🎲 振る</button>

  <div class="row">
    <button class="secondary" id="all">すべて選択</button>
    <button class="secondary" id="none">すべて解除</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="history">
    <h2>履歴</h2>
    <div id="history"></div>
  </div>

  <section class="customizer" aria-labelledby="customizer-title">
    <h2 id="customizer-title">デザインをカスタマイズ</h2>
    <p>好きな色を選ぶと、すぐに画面へ反映されます。</p>
    <div class="color-controls">
      <label class="color-control">メインカラー <input id="main-color" type="color" value="#7457d9"></label>
      <label class="color-control">サイコロのドット色 <input id="pip-color" type="color" value="#292333"></label>
      <label class="color-control">ボタンの色 <input id="button-color" type="color" value="#7457d9"></label>
      <label class="color-control">サイコロの色 <input id="dice-color" type="color" value="#ffffff"></label>
    </div>
  </section>
</div>

<script>
const facesEl = document.getElementById('faces');
const diceEl = document.getElementById('dice');
const rollBtn = document.getElementById('roll');
const probEl = document.getElementById('prob');
const statusEl = document.getElementById('status');
const historyEl = document.getElementById('history');
const pips = [...diceEl.querySelectorAll('.pip')];
const pingEffect = document.getElementById('ping-effect');

let selected = [1,2,3,4,5,6];
let history = [];

const pipPatterns = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8]
};

function renderDice(value) {
  pips.forEach((pip, index) => {
    pip.classList.toggle('is-visible', pipPatterns[value].includes(index));
  });
  diceEl.dataset.value = value;
  diceEl.setAttribute('aria-label', `${value}の目が出たサイコロ`);
}

function playPingEffect() {
  pingEffect.classList.remove('is-active');
  void pingEffect.offsetWidth;
  pingEffect.classList.add('is-active');
}

function renderFaces() {
  facesEl.innerHTML = '';
  for (let n = 1; n <= 6; n++) {
    const label = document.createElement('label');
    label.className = 'face' + (selected.includes(n) ? ' selected' : '');
    label.innerHTML = `<input type="checkbox" aria-label="${n}の目を出現させる" ${selected.includes(n) ? 'checked' : ''}>${n}`;
    label.addEventListener('click', (e) => {
      e.preventDefault();
      if (selected.includes(n)) {
        selected = selected.filter(x => x !== n);
      } else {
        selected.push(n);
        selected.sort((a,b) => a-b);
      }
      renderFaces();
      updateProb();
    });
    facesEl.appendChild(label);
  }
}

function updateProb() {
  if (selected.length === 0) {
    probEl.textContent = '面が選択されていません';
    rollBtn.disabled = true;
    return;
  }
  rollBtn.disabled = false;
  const p = (100 / selected.length).toFixed(2);
  probEl.textContent = `${selected.length}面を選択中 → 各 ${p}%`;
}

function secureRandomIndex(max) {
  // 可能なら暗号学的乱数を使う。ただし「完全に一様な候補選択」が目的なので
  // rejection sampling で modulo bias を避ける。
  const cryptoObj = window.crypto;
  const limit = Math.floor(0x100000000 / max) * max;
  const arr = new Uint32Array(1);
  while (true) {
    cryptoObj.getRandomValues(arr);
    if (arr[0] < limit) return arr[0] % max;
  }
}

function renderHistory() {
  historyEl.innerHTML = history.map((n, i) =>
    `<span class="history-item">${i + 1}: ${n}</span>`
  ).join('');
}

async function roll() {
  if (selected.length === 0) return;
  rollBtn.disabled = true;
  diceEl.classList.add('rolling');
  statusEl.textContent = '抽選中…';

  // 見た目だけの演出。実際の当選値は最後に一度だけ抽選。
  await new Promise(r => setTimeout(r, 550));

  const result = selected[secureRandomIndex(selected.length)];
  diceEl.classList.remove('rolling');
  renderDice(result);
  playPingEffect();

  history.unshift(result);
  history = history.slice(0, 20);
  renderHistory();

  statusEl.textContent = `候補 ${selected.join('・')} から一様に抽選しました`;
  updateProb();
}

document.getElementById('all').addEventListener('click', () => {
  selected = [1,2,3,4,5,6];
  renderFaces();
  updateProb();
});

document.getElementById('none').addEventListener('click', () => {
  selected = [];
  renderFaces();
  updateProb();
});

rollBtn.addEventListener('click', roll);

const colorControls = {
  'main-color': '--main-color',
  'pip-color': '--pip-color',
  'button-color': '--button-color',
  'dice-color': '--dice-color'
};

Object.entries(colorControls).forEach(([id, variable]) => {
  document.getElementById(id).addEventListener('input', (event) => {
    document.documentElement.style.setProperty(variable, event.target.value);
  });
});

renderFaces();
updateProb();
</script>
</body>
</html>
