<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制限つき一様乱数サイコロ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f6f3ff;
    color: #292333;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: min(760px, 100%);
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(50, 35, 80, .12);
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .desc { margin: 0 0 24px; color: #716b7d; }
  .dice {
    width: 180px;
    height: 180px;
    margin: 12px auto 24px;
    border: 5px solid #292333;
    border-radius: 28px;
    display: grid;
    place-items: center;
    font-size: 76px;
    font-weight: 800;
    background: #fff;
    transition: transform .12s ease;
  }
  .rolling { animation: shake .18s infinite alternate; }
  @keyframes shake {
    from { transform: rotate(-4deg) scale(.98); }
    to { transform: rotate(4deg) scale(1.02); }
  }
  .faces {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin: 12px 0 20px;
  }
  .face {
    border: 2px solid #ddd7e8;
    background: #faf9fc;
    border-radius: 14px;
    padding: 14px 6px;
    cursor: pointer;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    user-select: none;
  }
  .face.selected {
    border-color: #7457d9;
    background: #eee9ff;
    color: #5a3bc0;
  }
  .face input { display: none; }
  button {
    border: 0;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .roll {
    width: 100%;
    background: #7457d9;
    color: white;
    font-size: 20px;
    padding: 17px;
  }
  .roll:disabled { opacity: .55; cursor: not-allowed; }
  .secondary {
    background: #eeeaf5;
    color: #40384e;
  }
  .row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .row button { flex: 1; }
  .status {
    text-align: center;
    color: #716b7d;
    margin: 14px 0 0;
    min-height: 24px;
  }
  .history {
    margin-top: 26px;
    border-top: 1px solid #eeeaf2;
    padding-top: 20px;
  }
  .history h2 { font-size: 18px; margin: 0 0 10px; }
  #history {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .history-item {
    background: #f3f0f8;
    border-radius: 10px;
    padding: 7px 11px;
    font-weight: 700;
  }
  .prob {
    text-align: center;
    font-size: 14px;
    color: #716b7d;
    margin-top: 4px;
  }
  @media (max-width: 520px) {
    .faces { grid-template-columns: repeat(3, 1fr); }
    .app { padding: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎲 制限つき一様乱数サイコロ</h1>
  <p class="desc">出る面だけ選択。選択された面はすべて同じ確率で出ます。</p>

  <div id="dice" class="dice">?</div>

  <div class="prob" id="prob">6面すべて選択中 → 各 16.67%</div>

  <h2>出現させる面</h2>
  <div class="faces" id="faces"></div>

  <button class="roll" id="roll">🎲 振る</button>

  <div class="row">
    <button class="secondary" id="all">すべて選択</button>
    <button class="secondary" id="none">すべて解除</button>
  </div>

  <div class="status" id="status"></div>

  <div class="history">
    <h2>履歴</h2>
    <div id="history"></div>
  </div>
</div>

<script>
const facesEl = document.getElementById('faces');
const diceEl = document.getElementById('dice');
const rollBtn = document.getElementById('roll');
const probEl = document.getElementById('prob');
const statusEl = document.getElementById('status');
const historyEl = document.getElementById('history');

let selected = [1,2,3,4,5,6];
let history = [];

function renderFaces() {
  facesEl.innerHTML = '';
  for (let n = 1; n <= 6; n++) {
    const label = document.createElement('label');
    label.className = 'face' + (selected.includes(n) ? ' selected' : '');
    label.innerHTML = `<input type="checkbox" ${selected.includes(n) ? 'checked' : ''}>${n}`;
    label.addEventListener('click', (e) => {
      e.preventDefault();
      if (selected.includes(n)) {
        selected = selected.filter(x => x !== n);
      } else {
        selected.push(n);
        selected.sort((a,b) => a-b);
      }
      renderFaces();
      updateProb();
    });
    facesEl.appendChild(label);
  }
}

function updateProb() {
  if (selected.length === 0) {
    probEl.textContent = '面が選択されていません';
    rollBtn.disabled = true;
    return;
  }
  rollBtn.disabled = false;
  const p = (100 / selected.length).toFixed(2);
  probEl.textContent = `${selected.length}面を選択中 → 各 ${p}%`;
}

function secureRandomIndex(max) {
  // 可能なら暗号学的乱数を使う。ただし「完全に一様な候補選択」が目的なので
  // rejection sampling で modulo bias を避ける。
  const cryptoObj = window.crypto;
  const limit = Math.floor(0x100000000 / max) * max;
  const arr = new Uint32Array(1);
  while (true) {
    cryptoObj.getRandomValues(arr);
    if (arr[0] < limit) return arr[0] % max;
  }
}

function renderHistory() {
  historyEl.innerHTML = history.map((n, i) =>
    `<span class="history-item">${i + 1}: ${n}</span>`
  ).join('');
}

async function roll() {
  if (selected.length === 0) return;
  rollBtn.disabled = true;
  diceEl.classList.add('rolling');
  statusEl.textContent = '抽選中…';

  // 見た目だけの演出。実際の当選値は最後に一度だけ抽選。
  await new Promise(r => setTimeout(r, 550));

  const result = selected[secureRandomIndex(selected.length)];
  diceEl.textContent = result;
  diceEl.classList.remove('rolling');

  history.unshift(result);
  history = history.slice(0, 20);
  renderHistory();

  statusEl.textContent = `候補 ${selected.join('・')} から一様に抽選しました`;
  updateProb();
}

document.getElementById('all').addEventListener('click', () => {
  selected = [1,2,3,4,5,6];
  renderFaces();
  updateProb();
});

document.getElementById('none').addEventListener('click', () => {
  selected = [];
  renderFaces();
  updateProb();
});

rollBtn.addEventListener('click', roll);

renderFaces();
updateProb();
</script>
</body>
</html>
